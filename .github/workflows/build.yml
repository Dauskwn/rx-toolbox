name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exe (csc.exe from .NET Framework 4.8)
        shell: pwsh
        run: .\build\build.ps1

      - name: Show artifact
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          Get-FileHash dist\*.exe -Algorithm SHA256 | Format-Table

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: RXToolbox-unsigned
          path: dist/*.exe
          if-no-files-found: error

